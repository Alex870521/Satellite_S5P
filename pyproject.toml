[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-s5p"
version = "0.1.0"
description = "Sentinel-5P 資料處理與視覺化工具"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alex870521", email = "alex870521@gmail.com" }
]

dependencies = [
    "numpy>=1.26.0",
    "xarray>=2023.1.0",
    "dask[array]>=2024.1.0",
    "scipy>=1.12.0",
    "matplotlib>=3.7.0",
    "cartopy>=0.22.0",
    "geopandas>=0.13.0",
    "netCDF4>=1.6.0",
    "pandas>=2.0.0",
    "shapely>=2.0.0",
    # I/O, networking and CLI
    "requests>=2.32.0",
    "aiohttp>=3.10.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "certifi>=2024.8.30",
    "schedule>=1.2.0",
    # Imagery / animation
    "imageio>=2.36.0",
    "pillow>=10.4.0",
    # Satellite data access
    "cdsapi>=0.7.5",
    "sentinelsat>=1.2.0",
    "earthaccess>=0.14.0",
]

[project.optional-dependencies]
# HDF4 ingest only. Reading raw MODIS .hdf needs pyhdf (which bundles the HDF4
# C library). Run conversion on a machine where pyhdf installs (macOS/remote/conda);
# the analysis side reads NetCDF only and does not need this. No 3.14 wheel yet.
ingest = [
    "pyhdf>=0.11.6",
]
dev = [
    "flake8>=6.0.0",
    "black>=23.1.0",
    "mypy>=1.0.0",
    # mypy 用的型別檔;沒有的話 pandas/pytz 被當成 Any,本機與 CI 結果會不同
    "pandas-stubs",
    "types-pytz",
    "isort>=5.12.0",
    "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_data: test needs local satellite data files (skipped in CI)",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = false
# 型別檢查範圍(結構計畫 C14):先只守 L3 與 coverage,兩者已歸零。
# 擴大範圍時把目錄加進 files,並把它從下面的 ignore_errors 清單移除。
files = ["src/processing/l3", "src/coverage"]

[[tool.mypy.overrides]]
# 尚未整理型別的模組:照樣跟進 import(才知道介面),但不回報它們內部的錯。
# 舊 processor 依 l3/README「退場條件」並存,不在其上做大修。
module = [
    "src.processing.sentinel_processor",
    "src.processing.modis_processor",
    "src.processing.gems_processor",
    "src.processing.interpolators",
    "src.visualization.*",
    "src.config.richer",
    "src.api.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
# 沒附型別檔的第三方套件
module = ["cartopy.*", "pyhdf.*", "geopandas.*", "shapely.*", "scipy.*"]
ignore_missing_imports = true
